<title>Strud WEB</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{--bg:#1a1917;--panel:#262422;--elev:#33302d;--text:#f4f2ee;--dim:#a8a29e;--blood:#b81440;--blood-dim:#850d2e;--sick:#a1b853;--border:#403d39;--glow:rgba(184,20,64,.2);--warn:#e0b84a}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
#navbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 24px;background:rgba(26,25,23,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);flex-wrap:wrap}
.brand{font-weight:800;font-size:20px;letter-spacing:2px;text-transform:uppercase;color:var(--blood);display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand-logo,.auth-logo{border-radius:8px;display:block}
.brand-logo{height:32px;width:32px}
.auth-logo{height:64px;width:64px;margin:0 auto 12px}
#navlinks{display:flex;gap:4px;flex-wrap:wrap}
.navlink{padding:8px 12px;font-size:12.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);border:1px solid transparent;border-radius:3px;cursor:pointer}
.navlink:hover{color:var(--text);border-color:var(--border)}
.navlink.active{color:var(--text);background:var(--elev);border-color:var(--blood-dim)}
#authbar{display:flex;align-items:center;gap:10px}
.pill{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:4px 10px;border-radius:2px;border:1px solid var(--border);color:var(--dim);background:var(--elev)}
.pill.founder{color:#fff;background:var(--blood);border-color:var(--blood);font-weight:700}
.pill.admin{color:#000;background:var(--sick);border-color:var(--sick);font-weight:700}
.pill.clickable,.pill.me{cursor:pointer}
.pill.me{display:inline-flex;align-items:center;gap:8px}
.pill.clickable:hover,.pill.me:hover{border-color:var(--dim);color:var(--text)}
.avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--elev);border:1px solid var(--border);flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--dim);text-transform:uppercase}
.avatar.lg{width:32px;height:32px}
.btn{font-family:inherit;font-size:12.5px;font-weight:600;padding:9px 18px;background:var(--blood-dim);color:var(--text);border:1px solid var(--blood);border-radius:3px;cursor:pointer}
.btn:hover{background:var(--blood);box-shadow:0 0 10px var(--glow)}
.btn.ghost{background:transparent;border-color:var(--border);color:var(--dim)}
.btn.ghost:hover{color:var(--text);border-color:var(--dim)}
.btn.small{padding:5px 10px;font-size:11.5px}
.btn:disabled{opacity:.35;cursor:not-allowed}
main{max-width:820px;margin:0 auto;padding:32px 20px 80px}
.hero-section{text-align:center;margin:20px 0 40px;background:var(--panel);border:1px solid var(--border);padding:40px 20px;border-radius:4px}
.hero-section h1{font-size:32px;color:var(--blood);margin:0 0 12px;text-transform:uppercase;font-weight:800}
.hero-section p{font-size:14px;color:var(--dim);max-width:620px;margin:0 auto;line-height:1.6}
.features-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:32px}
.feature-box{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:20px}
.feature-box:hover{border-color:var(--blood-dim)}
.feature-box h3{margin:0 0 8px;font-family:'IBM Plex Mono',monospace;font-size:13px;text-transform:uppercase}
.feature-box p{margin:0;color:var(--dim);font-size:12.5px;line-height:1.5}
.auth-wrap{max-width:400px;margin:60px auto;padding:32px;background:var(--panel);border:1px solid var(--border);border-radius:4px}
.auth-wrap h1{font-weight:800;color:var(--blood);font-size:32px;margin:0 0 4px;text-align:center;letter-spacing:2px;text-transform:uppercase}
.auth-sub{text-align:center;color:var(--dim);font-size:13px;margin-bottom:24px}
.field{margin-bottom:16px;position:relative}
.field label{display:block;font-size:11px;color:var(--dim);margin-bottom:6px;font-family:'IBM Plex Mono',monospace}
.field input,.field textarea,.field select,.search-input{width:100%;padding:10px 12px;background:var(--elev);border:1px solid var(--border);color:var(--text);border-radius:3px;font-family:inherit;font-size:13.5px}
.field textarea{resize:vertical;min-height:90px}
.field input:focus,.field textarea:focus,.search-input:focus{outline:none;border-color:var(--blood)}
.counter{position:absolute;bottom:-16px;right:4px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim)}
.auth-toggle{text-align:center;margin-top:16px;font-size:13px;color:var(--dim)}
.auth-toggle span,.edit-msg-btn{cursor:pointer;text-decoration:underline}
.auth-toggle span{color:var(--blood)}
.edit-msg-btn{margin-left:6px}
.error-msg{color:#e26f6f;font-size:12px;margin-top:8px;font-family:'IBM Plex Mono',monospace}
.info-msg{color:var(--sick);font-size:12px;margin-top:8px;font-family:'IBM Plex Mono',monospace}
.feed-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.feed-header h2{font-weight:800;color:var(--blood);font-size:24px;margin:0}
.search-filter-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.search-group{display:flex;gap:10px;flex:1;min-width:200px;flex-wrap:wrap}
.search-input{flex:1;min-width:150px;padding:8px 12px;background:var(--panel);font-size:13px}
.filter-tags,.sort-tags{display:flex;gap:6px;flex-wrap:wrap}
.filter-btn,.sort-btn{background:var(--panel);border:1px solid var(--border);color:var(--dim);padding:6px 12px;font-size:12px;border-radius:3px;cursor:pointer;font-family:'IBM Plex Mono',monospace}
.filter-btn.active,.sort-btn.active{background:var(--elev);color:var(--text);border-color:var(--sick)}
.stats-banner{background:var(--panel);border-left:3px solid var(--blood-dim);padding:10px 16px;margin-bottom:24px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim);display:flex;gap:16px;flex-wrap:wrap}
.new-post-box,.post-card,.admin-section{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:20px;margin-bottom:20px}
.new-post-box h3{margin:0 0 14px;font-size:13px;color:var(--dim);font-family:'IBM Plex Mono',monospace;text-transform:uppercase}
.form-row-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
@media(max-width:650px){.form-row-grid{grid-template-columns:1fr}}
.post-card:hover{border-color:var(--dim)}
.post-meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);margin-bottom:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.post-meta .avatar{width:22px;height:22px;font-size:10px}
.post-meta .author{color:var(--sick);font-weight:500}
.post-title{font-size:18px;font-weight:700;margin:0 0 10px;color:#fff}
.post-content{font-size:14px;line-height:1.6;white-space:pre-wrap;margin-bottom:14px;word-break:break-word}
.special-link-btn{display:inline-flex;gap:6px;background:var(--elev);border:1px solid var(--border);color:var(--sick);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:6px 12px;border-radius:3px;margin-bottom:14px}
.special-link-btn:hover{border-color:var(--sick)}
.post-media-wrap{margin-bottom:14px;border-radius:3px;overflow:hidden;background:#000;border:1px solid var(--border)}
.post-img,.post-video-element{width:100%;max-height:450px;object-fit:contain;display:block}
.post-video-container{position:relative;padding-bottom:56.25%;height:0}
.post-video-container iframe,.yt-facade{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt-facade{cursor:pointer;background:#000 center/cover no-repeat;display:flex;align-items:center;justify-content:center}
.yt-facade span{background:rgba(184,20,64,.9);color:#fff;width:64px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px}
.post-gallery{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.post-gallery .post-media-wrap{margin-bottom:0}
.post-gallery .post-img{max-height:220px}
.post-rating{color:var(--warn);font-family:'IBM Plex Mono',monospace;font-size:12.5px;margin-bottom:10px}
.hashtag-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.hashtag-pill{background:var(--elev);border:1px solid var(--border);color:var(--sick);font-family:'IBM Plex Mono',monospace;font-size:11.5px;padding:3px 9px;border-radius:999px;cursor:pointer}
.spoiler-wrap{position:relative;margin-bottom:14px}
.spoiler-blur{filter:blur(14px);user-select:none;pointer-events:none}
.spoiler-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,9,8,.55)}
.spoiler-reveal-btn{background:var(--blood-dim);border:1px solid var(--blood);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:8px 16px;border-radius:4px;cursor:pointer}
.post-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px;border-top:1px solid rgba(255,255,255,.05);padding-top:14px}
.react-btn{background:var(--elev);border:1px solid var(--border);color:var(--dim);padding:6px 12px;border-radius:3px;font-size:12px;cursor:pointer;font-family:'IBM Plex Mono',monospace}
.react-btn:hover{border-color:var(--dim);color:var(--text)}
.react-btn.active-like{color:var(--sick);border-color:var(--sick)}
.react-btn.active-dislike{color:var(--blood);border-color:var(--blood)}
.react-btn.active-fav{color:#cca333;border-color:#cca333}
.empty-state{text-align:center;padding:60px 20px;color:var(--dim);font-family:'IBM Plex Mono',monospace}
.admin-section h3{font-family:'IBM Plex Mono',monospace;font-size:13px;text-transform:uppercase;color:var(--sick);margin:0 0 14px}
.app-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.app-row:last-child{border-bottom:none}
.app-row .txt{flex:1;min-width:0}
.app-row .who{font-weight:700;font-size:13px}
.app-row .msg{color:var(--dim);font-size:13px;margin-top:4px;word-break:break-word}
.status-tag{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:2px 8px;border-radius:2px}
.status-tag.beklemede{background:#4a3f25;color:#cca333}
.status-tag.kabul{background:#254a27;color:var(--sick)}
.status-tag.red{background:#4a2529;color:#e26f6f}
.status-tag.yellow{background:var(--warn);color:#000;font-weight:700}
.msg-row{padding:12px;border-bottom:1px solid var(--border)}
.msg-row:last-child{border-bottom:none}
.msg-row .from{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim)}
.msg-row .body{font-size:13px;margin-top:4px;word-break:break-word}
.msg-row.yellow{background:rgba(224,184,74,.12);border-left:4px solid var(--warn)}
.msg-row.yellow .from{color:var(--warn)}
.msg-row.yellow .body{color:#ffe9a8}
.chat-window{display:flex;flex-direction:column;height:60vh}
.chat-messages{flex:1;overflow-y:auto;margin-bottom:14px;display:flex;flex-direction:column;gap:10px;padding:4px}
.chat-bubble{max-width:75%;border:1px solid var(--border);border-radius:8px;padding:9px 13px}
.chat-bubble.mine{align-self:flex-end;background:var(--blood-dim);border-color:var(--blood)}
.chat-bubble.theirs{align-self:flex-start;background:var(--elev)}
.chat-bubble .txt{font-size:13.5px;white-space:pre-wrap;line-height:1.4;word-break:break-word}
.chat-bubble .time{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--dim);margin-top:5px}
.chat-form{display:flex;gap:8px}
.chat-form input{flex:1}
.upload-row{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.upload-status{font-size:11px;color:var(--dim);font-family:'IBM Plex Mono',monospace}
.upload-status.err{color:#e26f6f}
.dropzone{border:2px dashed var(--border);border-radius:6px;padding:28px 16px;text-align:center;color:var(--dim);font-size:13px;cursor:pointer;margin-bottom:12px}
.dropzone.over,.dropzone:hover{border-color:var(--blood);color:var(--text);background:rgba(184,20,64,.06)}
.file-chip{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;background:var(--elev);border:1px solid var(--border);border-radius:3px;margin-bottom:6px;font-family:'IBM Plex Mono',monospace;font-size:12px}
.progress{height:6px;background:var(--elev);border-radius:3px;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;width:0;background:var(--blood);transition:width .2s}
.game-cover{width:100%;max-height:300px;object-fit:cover;border-radius:3px;margin-bottom:14px;display:block;background:#000}
footer{text-align:center;padding:40px 0;color:var(--dim);font-size:11px;font-family:'IBM Plex Mono',monospace}
</style>
</head>

const toHex = buf => [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, '0')).join('');
const toB64 = u8 => { let s = ''; for(let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };

// Oyun ZIP'ini tarayıcıda parçalara böler, AES-256-GCM ile şifreler, private 'games' bucket'ına yükler.
// Parça biçimi: [12 bayt iv][şifreli veri + 16 bayt etiket], AAD = parça numarası (0'dan).
async function encryptGameChunks(file, folder, onProgress){
  const raw = crypto.getRandomValues(new Uint8Array(32));
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt']);
  const count = Math.ceil(file.size / GAME_CHUNK_BYTES), chunks = [], paths = [];
  try{
    for(let i = 0; i < count; i++){
      const plain = await file.slice(i * GAME_CHUNK_BYTES, Math.min((i + 1) * GAME_CHUNK_BYTES, file.size)).arrayBuffer();
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: new TextEncoder().encode(String(i)) }, key, plain));
      const blob = new Uint8Array(12 + ct.length); blob.set(iv, 0); blob.set(ct, 12);
      const path = `${folder}/${String(i).padStart(4, '0')}.bin`;
      await putFile('games', path, new Blob([blob], { type: 'application/octet-stream' }), p => onProgress(i, count, p));
      paths.push(path);
      chunks.push({ i, path, size: blob.length, plainSize: plain.byteLength, sha256: toHex(await crypto.subtle.digest('SHA-256', blob)) });
    }
  }catch(err){
    if(paths.length) await supabase.storage.from('games').remove(paths);
    throw err;
  }
  return { key: toB64(raw), chunks, paths };
}

async function downloadMergedVideo(urls, fileName, button){
  const old = button.textContent; button.disabled = true;
  try{
    const { ffmpeg, fetchFile } = await loadFfmpeg();
    const names = [];
    for(let i = 0; i < urls.length; i++){
      button.textContent = `Video hazırlanıyor ${i + 1}/${urls.length}...`;
      const r = await fetch(urls[i]); if(!r.ok) throw new Error(`Video parçası ${i + 1} indirilemedi`);
      const name = `merge-part-${String(i).padStart(4,'0')}.mp4`;
      await ffmpeg.writeFile(name, await fetchFile(await r.blob())); names.push(name);
    }
    const list = names.map(n => `file '${n}'`).join('\n');
    await ffmpeg.writeFile('merge-list.txt', new TextEncoder().encode(list));
    await ffmpeg.exec(['-f','concat','-safe','0','-i','merge-list.txt','-c','copy','merged-video.mp4']);
    const out = await ffmpeg.readFile('merged-video.mp4');
    const blob = new Blob([out.buffer], { type: 'video/mp4' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    for(const n of [...names, 'merge-list.txt', 'merged-video.mp4']){ try{ await ffmpeg.deleteFile(n); }catch(e){} }
  }catch(err){ alert('Video birleştirilemedi: ' + (err.message || err)); }
  finally{ button.disabled = false; button.textContent = old; }
}

async function uploadResumable(bucket, path, file, onProgress){
  if(!window.tus){
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/tus-js-client@4.1.0/dist/tus.min.js';
      s.onload = res; s.onerror = () => rej(new Error('Yükleme kütüphanesi indirilemedi'));
      document.head.appendChild(s);
    });
  }
  const { data: { session } } = await supabase.auth.getSession();
  if(!session) throw new Error('Oturum bulunamadı');
  const ref = new URL(SUPABASE_URL).hostname.split('.')[0];
  await new Promise((resolve, reject) => {
    const up = new window.tus.Upload(file, {
      endpoint: `https://${ref}.storage.supabase.co/storage/v1/upload/resumable`,
      retryDelays: [0,3000,5000,10000,20000],
      headers: { authorization: `Bearer ${session.access_token}`, apikey: SUPABASE_ANON_KEY, 'x-upsert': 'false' },
      uploadDataDuringCreation: true, removeFingerprintOnSuccess: true,
      metadata: { bucketName: bucket, objectName: path, contentType: file.type || 'application/octet-stream', cacheControl: '31536000' },
      chunkSize: 6 * 1024 * 1024,
      onError: reject,
      onProgress: (s, tot) => onProgress && onProgress(Math.floor(s / tot * 100)),
      onSuccess: resolve,
    });
    up.findPreviousUploads().then(p => { if(p.length) up.resumeFromPreviousUpload(p[0]); up.start(); }).catch(() => up.start());
  });
}

async function putFile(bucket, path, file, onProgress){
  if(file.size > RESUMABLE_THRESHOLD) await uploadResumable(bucket, path, file, onProgress);
  else {
    const { error } = await supabase.storage.from(bucket).upload(path, file, { cacheControl: '31536000', upsert: false, contentType: file.type || 'application/octet-stream' });
    if(error) throw error;
    onProgress && onProgress(100);
  }
  return supabase.storage.from(bucket).getPublicUrl(path).data.publicUrl;
}

async function loadFfmpeg(){
  if(ffmpegInstance) return ffmpegInstance;
  const [{ FFmpeg }, { fetchFile, toBlobURL }] = await Promise.all([
    import('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js'),
    import('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js')
  ]);
  const ffmpeg = new FFmpeg(), base = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd';
  if(!ffmpegWorkerBlobUrl){
    const r = await fetch('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/814.ffmpeg.js', { mode: 'cors' });
    if(!r.ok) throw new Error('FFmpeg Worker indirilemedi.');
    ffmpegWorkerBlobUrl = URL.createObjectURL(new Blob([await r.text()], { type: 'text/javascript' }));
  }
  await ffmpeg.load({
    classWorkerURL: ffmpegWorkerBlobUrl,
    coreURL: await toBlobURL(`${base}/ffmpeg-core.js`, 'text/javascript'),
    wasmURL: await toBlobURL(`${base}/ffmpeg-core.wasm`, 'application/wasm')
  });
  return (ffmpegInstance = { ffmpeg, fetchFile });
}

async function uploadVideoParts(bucket, file, onProgress){
  const { ffmpeg, fetchFile } = await loadFfmpeg();
  const input = `input-${Date.now()}.mp4`;
  await ffmpeg.writeFile(input, await fetchFile(file));
  await ffmpeg.exec(['-i', input, '-c:v','libx264','-preset','veryfast','-crf','28','-pix_fmt','yuv420p','-c:a','aac','-b:a','128k',
    '-force_key_frames','expr:gte(t,n_forced*60)','-f','segment','-segment_time','60','-reset_timestamps','1','-movflags','+faststart','strud-part-%03d.mp4']);
  const names = (await ffmpeg.listDir('.')).map(x => x.name).filter(n => /^strud-part-\d+\.mp4$/.test(n)).sort();
  if(!names.length) throw new Error('Video segmentlere ayrıştırılamadı.');
  const urls = [];
  for(let i = 0; i < names.length; i++){
    const part = new File([await ffmpeg.readFile(names[i])], names[i], { type: 'video/mp4' });
    const path = `${currentUser.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}-part-${String(i+1).padStart(3,'0')}.mp4`;
    urls.push(await putFile(bucket, path, part, pct => onProgress && onProgress(Math.floor(((i + pct/100) / names.length) * 100))));
    await ffmpeg.deleteFile(names[i]);
  }
  await ffmpeg.deleteFile(input);
  return JSON.stringify({ __strudVideoParts: 1, parts: urls });
}

async function uploadToStorage(bucket, file, kind, onProgress, maxMBOverride){
  const isImage = file.type.startsWith('image/'), isVideo = file.type.startsWith('video/');
  if((kind === 'image' && !isImage) || (kind === 'video' && !isVideo)) throw new Error(t('err_file_type'));
  const maxMB = maxMBOverride || (kind === 'video' ? MAX_VIDEO_MB : MAX_IMAGE_MB);
  if(file.size > maxMB * 1024 * 1024) throw new Error(t('err_file_too_big').replace('{n}', maxMB));
  if(isVideo && file.size > VIDEO_PART_MB * 1024 * 1024) return uploadVideoParts(bucket, file, onProgress);
  const ext = (file.name.split('.').pop() || (isVideo ? 'mp4' : 'jpg')).toLowerCase().replace(/[^a-z0-9]/g, '');
  return putFile(bucket, `${currentUser.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`, file, onProgress);
}

function enhanceUploadFields(root){
  root.querySelectorAll('input[data-upload]').forEach(input => {
    if(input.dataset.uploadReady) return;
    input.dataset.uploadReady = '1';
    const kind = input.dataset.upload;
    if(kind === 'video' && isVideoPartsManifest(input.value)){ input.dataset.videoParts = input.value; input.value = getVideoParts(input.value)[0] || ''; }
    input.addEventListener('input', () => { if(kind === 'video') delete input.dataset.videoParts; });
    const row = document.createElement('div');
    row.className = 'upload-row';
    row.innerHTML = `<button type="button" class="btn ghost small">${t('btn_upload_pc')}</button><span class="upload-status"></span>`;
    const btn = row.querySelector('button'), status = row.querySelector('.upload-status');
    const picker = document.createElement('input');
    picker.type = 'file'; picker.accept = kind === 'video' ? 'video/*' : 'image/*'; picker.style.display = 'none';
    btn.onclick = () => picker.click();
    picker.onchange = async () => {
      const file = picker.files && picker.files[0]; if(!file) return;
      status.className = 'upload-status'; status.textContent = t('upload_uploading'); btn.disabled = true;
      const form = input.closest('form'), submitBtn = form && form.querySelector('button[type="submit"]');
      if(submitBtn) submitBtn.disabled = true;
      try{
        const url = await uploadToStorage('post-media', file, kind, p => { status.textContent = t('upload_uploading') + ' %' + p; });
        if(kind === 'video' && isVideoPartsManifest(url)){ input.dataset.videoParts = url; input.value = getVideoParts(url)[0] || ''; }
        else { delete input.dataset.videoParts; input.value = url; }
        status.textContent = t('upload_done');
      }catch(err){
        status.className = 'upload-status err';
        status.textContent = t('err_upload') + (err.message || '');
      }finally{
        btn.disabled = false; if(submitBtn) submitBtn.disabled = false; picker.value = '';
      }
    };
    row.appendChild(picker);
    input.insertAdjacentElement('afterend', row);
  });
}

function playNotificationSound(){
  try{
    const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination); o.frequency.value = 880;
    g.gain.setValueAtTime(.15, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .25);
    o.start(); o.stop(c.currentTime + .25); setTimeout(() => c.close(), 400);
  }catch(e){}
}
async function fetchNotificationsFromDB(){
  const { data, error } = await supabase.from('notifications')
    .select('id, sender_id, content, created_at, profiles!notifications_sender_id_fkey(nickname)')
    .eq('user_id', currentUser.id).order('created_at', { ascending: false });
  if(error){ console.error(error); return []; }
  return (data || []).map(n => ({ id: n.id, senderId: n.sender_id, nickname: n.profiles?.nickname || '?', content: n.content, created_at: n.created_at }));

function startGlobalMessageListener(){

    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications', filter: `user_id=eq.${currentUser.id}` }, async payload => {
      const row = payload.new;

      const { data: sp } = await supabase.from('profiles').select('nickname').eq('id', row.sender_id).maybeSingle();
      const nickname = sp?.nickname || '?';
      notifications.unshift({ id: row.id, senderId: row.sender_id, nickname, content: row.content, created_at: row.created_at });
      playNotificationSound(); renderNav(); updateTabTitleBadge();
      if('Notification' in window && Notification.permission === 'granted' && document.visibilityState !== 'visible'){
        try{ const n = new Notification(nickname, { body: row.content, icon: LOGO }); n.onclick = () => window.focus(); }catch(e){}

async function fetchPostsPage(category, offset, limit){
  const { data: posts, error } = await supabase.from('posts')
    .select('id, category, title, content, image_url, image_url_2, image_url_3, video_url, tags, hashtags, is_spoiler, rating, author_id, created_at, profiles!posts_author_id_fkey(nickname, avatar_url)')
    .eq('category', category).order('created_at', { ascending: false }).range(offset, offset + limit - 1);
  if(error){ console.error(error); return []; }
  const ids = posts.map(p => p.id); let reactions = [], favs = [];
  if(ids.length){
    const [r, f] = await Promise.all([
      supabase.from('post_reactions').select('post_id, user_id, type').in('post_id', ids),
      supabase.from('favorites').select('post_id').in('post_id', ids).eq('user_id', currentUser.id)
    ]);
    reactions = r.data || []; favs = f.data || [];
  }
  return posts.map(p => {
    const pr = reactions.filter(r => r.post_id === p.id);
    return { ...p, likeCount: pr.filter(r => r.type === 'like').length, dislikeCount: pr.filter(r => r.type === 'dislike').length,
      myReaction: pr.find(r => r.user_id === currentUser.id)?.type || null, isFav: favs.some(f => f.post_id === p.id) };
  });
}

function filterAndRenderPosts(category){
  const listEl = document.getElementById('postList'); if(!listEl) return;
  const q = currentSearchQuery;
  let filtered = allFetchedPosts.filter(p => {
    const ms = !q || p.title.toLowerCase().includes(q) || p.content.toLowerCase().includes(q) || (p.profiles?.nickname || '').toLowerCase().includes(q) || (p.hashtags || []).some(h => h.toLowerCase().includes(q));
    const mt = currentMediaTypeFilter === 'image' ? !!p.image_url : currentMediaTypeFilter === 'video' ? !!p.video_url : true;
    return ms && mt;
  });
  filtered.sort((a, b) => currentSortMode === 'populer' ? b.likeCount - a.likeCount
    : currentSortMode === 'trend' ? (b.likeCount + b.dislikeCount) - (a.likeCount + a.dislikeCount)
    : new Date(b.created_at) - new Date(a.created_at));

  document.getElementById('user-stats-area').innerHTML = `<span>${t('stats_category_posts')}: ${allFetchedPosts.length}</span><span>${t('stats_image_count')}: ${allFetchedPosts.filter(p => p.image_url).length}</span><span>${t('stats_video_count')}: ${allFetchedPosts.filter(p => p.video_url).length}</span>`;
  listEl.innerHTML = filtered.length ? filtered.map(renderPostCard).join('') : `<div class="empty-state">${t('empty_no_data')}</div>`;
  if(filtered.length) attachPostHandlers(category);

  const lm = document.getElementById('loadMoreWrap');
  if(lm){
    lm.innerHTML = feedHasMore ? `<button class="btn ghost" id="loadMoreBtn" style="width:100%" ${feedLoadingMore ? 'disabled' : ''}>${feedLoadingMore ? t('loading_more') : t('btn_load_more')}</button>` : '';
    const b = document.getElementById('loadMoreBtn'); if(b) b.onclick = () => loadMoreFeedPosts(category);
  }
}
async function loadMoreFeedPosts(category){
  if(feedLoadingMore || !feedHasMore) return;
  feedLoadingMore = true; filterAndRenderPosts(category);
  const next = await fetchPostsPage(category, allFetchedPosts.length, FEED_PAGE_SIZE);
  allFetchedPosts = allFetchedPosts.concat(next); feedHasMore = next.length === FEED_PAGE_SIZE; feedLoadingMore = false;
  filterAndRenderPosts(category);
}

async function refreshSinglePostReactions(postId){
  const { data: r } = await supabase.from('post_reactions').select('user_id, type').eq('post_id', postId);
  const idx = allFetchedPosts.findIndex(p => p.id === postId);
  if(idx !== -1) allFetchedPosts[idx] = { ...allFetchedPosts[idx], likeCount: (r||[]).filter(x => x.type === 'like').length, dislikeCount: (r||[]).filter(x => x.type === 'dislike').length, myReaction: (r||[]).find(x => x.user_id === currentUser.id)?.type || null };
}
function startFeedRealtime(category){
  stopFeedRealtime();
  feedChannel = supabase.channel('feed-' + category)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'posts', filter: `category=eq.${category}` }, async payload => {
      const np = payload.new; if(allFetchedPosts.some(p => p.id === np.id)) return;
      const { data: ap } = await supabase.from('profiles').select('nickname, avatar_url').eq('id', np.author_id).maybeSingle();
      allFetchedPosts.unshift({ ...np, profiles: { nickname: ap?.nickname || '?', avatar_url: ap?.avatar_url || null }, likeCount: 0, dislikeCount: 0, myReaction: null, isFav: false });
      filterAndRenderPosts(category);
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'posts', filter: `category=eq.${category}` }, payload => {
      const i = allFetchedPosts.findIndex(p => p.id === payload.new.id); if(i === -1) return;
      allFetchedPosts[i] = { ...allFetchedPosts[i], ...payload.new }; filterAndRenderPosts(category);
    })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'posts', filter: `category=eq.${category}` }, payload => {
      allFetchedPosts = allFetchedPosts.filter(p => p.id !== payload.old.id); filterAndRenderPosts(category);
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'post_reactions' }, async payload => {
      const id = payload.new?.post_id || payload.old?.post_id;
      if(!id || !allFetchedPosts.some(p => p.id === id)) return;
      await refreshSinglePostReactions(id); filterAndRenderPosts(category);
    }).subscribe();
}
function stopFeedRealtime(){ if(feedChannel){ supabase.removeChannel(feedChannel); feedChannel = null; } }

      ${canEdit ? `<button class="react-btn" data-action="edit">${t('edit_btn')}</button>` : ''}

function attachPostHandlers(category){
  document.querySelectorAll('.post-card').forEach(card => {
    const postId = card.dataset.postId;
    card.querySelectorAll('[data-action]').forEach(btn => btn.onclick = async () => {
      const a = btn.dataset.action;
      if(a === 'like' || a === 'dislike'){ await toggleReaction(postId, a); filterAndRenderPosts(category); }
      else if(a === 'fav'){ await toggleFavorite(postId); filterAndRenderPosts(category); }
      else if(a === 'edit') startEditPost(postId);
      else if(a === 'delete'){
        if(!confirm(t('confirm_delete_post'))) return;
        const { error } = await supabase.from('posts').delete().eq('id', postId);
        if(error){ alert(t('err_action_failed') + error.message); return; }
        allFetchedPosts = allFetchedPosts.filter(p => p.id !== postId); filterAndRenderPosts(category);
      } else if(a === 'report'){
        const msg = prompt(t('report_prompt'));
        if(msg){ await supabase.from('founder_messages').insert({ sender_id: currentUser.id, content: `[RAPOR - ID:${postId}] ${msg}` }); alert(t('report_success')); }
      } else if(a === 'download-video'){
        let urls = []; try{ urls = JSON.parse(btn.dataset.videoParts || '[]'); }catch(e){}
        if(urls.length) await downloadMergedVideo(urls, `video-${postId}.mp4`, btn);
      } else if(a === 'reveal-spoiler'){
        const w = card.querySelector('.spoiler-wrap');
        if(w){ w.querySelector('.spoiler-blur')?.classList.remove('spoiler-blur'); w.querySelector('.spoiler-overlay')?.remove(); }
      }
    });
    card.querySelectorAll('[data-hashtag]').forEach(pill => pill.onclick = () => {
      currentSearchQuery = pill.dataset.hashtag.toLowerCase();
      const si = document.getElementById('postSearch'); if(si) si.value = pill.dataset.hashtag;
      filterAndRenderPosts(category);
    });
  });
}

function updateLocalReaction(postId, type){
  const i = allFetchedPosts.findIndex(p => p.id === postId); if(i === -1) return;
  const p = allFetchedPosts[i]; let l = p.likeCount, d = p.dislikeCount;
  if(p.myReaction === 'like') l--; if(p.myReaction === 'dislike') d--;
  if(type === 'like') l++; if(type === 'dislike') d++;
  allFetchedPosts[i] = { ...p, likeCount: l, dislikeCount: d, myReaction: type };
}
async function toggleReaction(postId, type){
  const cur = allFetchedPosts.find(p => p.id === postId)?.myReaction || null;
  if(cur === type){ await supabase.from('post_reactions').delete().eq('post_id', postId).eq('user_id', currentUser.id); updateLocalReaction(postId, null); }
  else { await supabase.from('post_reactions').upsert({ post_id: postId, user_id: currentUser.id, type }, { onConflict: 'post_id,user_id' }); updateLocalReaction(postId, type); }
}
async function toggleFavorite(postId){
  const i = allFetchedPosts.findIndex(p => p.id === postId); if(i === -1) return;
  const fav = allFetchedPosts[i].isFav;
  if(fav) await supabase.from('favorites').delete().eq('post_id', postId).eq('user_id', currentUser.id);
  else await supabase.from('favorites').upsert({ post_id: postId, user_id: currentUser.id }, { onConflict: 'user_id,post_id', ignoreDuplicates: true });
  allFetchedPosts[i] = { ...allFetchedPosts[i], isFav: !fav };
}

  listEl.querySelectorAll('[data-notif-id]').forEach(row => row.onclick = async () => {
    const n = notifications.find(x => x.id === row.dataset.notifId); if(!n) return;
    notifications = notifications.filter(x => x.id !== n.id); updateTabTitleBadge(); renderNav();
    await supabase.from('notifications').delete().eq('id', n.id);
    window.location.hash = '#/dm/' + n.senderId;
  });
}

/* ================= ARKADAŞLAR ================= */
async function renderFriends(){
  mainEl.innerHTML = `<div class="feed-header"><h2>${t('friends_heading')}</h2></div><div class="empty-state">${t('admin_sync')}</div>`;
  const fr = (sel, col, status) => supabase.from('friend_requests').select(sel).eq(col, currentUser.id).eq('status', status);
  const [{ data: incoming }, { data: outgoing }, { data: asSender }, { data: asReceiver }] = await Promise.all([
    fr('id, sender_id, profiles!friend_requests_sender_id_fkey(nickname)', 'receiver_id', 'bekliyor'),
    fr('id, receiver_id, profiles!friend_requests_receiver_id_fkey(nickname)', 'sender_id', 'bekliyor'),
    fr('receiver_id, profiles!friend_requests_receiver_id_fkey(nickname)', 'sender_id', 'kabul'),
    fr('sender_id, profiles!friend_requests_sender_id_fkey(nickname)', 'receiver_id', 'kabul'),
  ]);
  const fm = new Map();
  [...(asSender || []).map(f => ({ id: f.receiver_id, nickname: f.profiles?.nickname })), ...(asReceiver || []).map(f => ({ id: f.sender_id, nickname: f.profiles?.nickname }))]
    .forEach(f => { if(!fm.has(f.id)) fm.set(f.id, f); });
  const friends = [...fm.values()], dimTxt = k => `<div style="color:var(--dim);font-size:13px">${t(k)}</div>`;

  mainEl.innerHTML = `<div class="feed-header"><h2>${t('friends_heading')}</h2></div>
    <div class="new-post-box"><h3>${t('friends_search_heading')}</h3>
      <form id="fsForm" style="display:flex;gap:8px"><input type="text" id="fsInput" class="search-input" placeholder="${t('friend_search_placeholder')}" required><button type="submit" class="btn">${t('btn_search')}</button></form>
      <div id="fsResults" style="margin-top:14px"></div></div>
    <div class="admin-section"><h3>${t('incoming_requests_heading')}</h3>${(incoming || []).length ? incoming.map(r => `<div class="app-row" data-request-id="${r.id}"><div class="txt"><div class="who">${escapeHtml(r.profiles?.nickname || '?')}</div></div><div style="display:flex;gap:6px"><button class="btn small" data-req-action="kabul">${t('btn_accept')}</button><button class="btn ghost small" data-req-action="red">${t('btn_reject')}</button></div></div>`).join('') : dimTxt('no_pending_requests')}</div>
    <div class="admin-section"><h3>${t('outgoing_requests_heading')}</h3>${(outgoing || []).length ? outgoing.map(r => `<div class="app-row"><div class="txt"><div class="who">${escapeHtml(r.profiles?.nickname || '?')} <span class="status-tag beklemede">${t('status_pending')}</span></div></div></div>`).join('') : dimTxt('no_sent_requests')}</div>
    <div class="admin-section"><h3>${t('my_friends_heading')}</h3>${friends.length ? friends.map(f => `<div class="app-row"><div class="txt"><div class="who">${escapeHtml(f.nickname || '?')}</div></div><button class="btn small" data-chat-with="${f.id}">${t('btn_chat')}</button></div>`).join('') : dimTxt('no_friends_yet')}</div>`;

  document.getElementById('fsForm').onsubmit = async e => {
    e.preventDefault();
    const q = document.getElementById('fsInput').value.trim().replace(/[%,()]/g, ''); if(!q) return;
    const { data: res } = await supabase.from('profiles').select('id, nickname').ilike('nickname', `%${q}%`).neq('id', currentUser.id).limit(10);
    const el = document.getElementById('fsResults');
    if(!res || !res.length){ el.innerHTML = dimTxt('no_results_found'); return; }
    el.innerHTML = res.map(u => `<div class="app-row"><div class="txt"><div class="who">${escapeHtml(u.nickname)}</div></div><button class="btn small" data-send-request="${u.id}">${t('btn_send_request')}</button></div>`).join('');
    el.querySelectorAll('[data-send-request]').forEach(b => b.onclick = async () => {
      const { error } = await supabase.from('friend_requests').insert({ sender_id: currentUser.id, receiver_id: b.dataset.sendRequest });
      if(error){ alert(t('err_request_failed') + error.message); return; }
      b.textContent = t('btn_sent'); b.disabled = true;
    });
  };
  document.querySelectorAll('[data-req-action]').forEach(b => b.onclick = async () => {
    await supabase.from('friend_requests').update({ status: b.dataset.reqAction }).eq('id', b.closest('.app-row').dataset.requestId);
    renderFriends();
  });
  document.querySelectorAll('[data-chat-with]').forEach(b => b.onclick = () => { window.location.hash = '#/dm/' + b.dataset.chatWith; });
}

/* ================= SOHBET ================= */
const canDeleteMessage = m => m.sender_id === currentUser.id || isFounder();

async function renderChat(friendId){
  const { data: fp } = await supabase.from('profiles').select('nickname').eq('id', friendId).maybeSingle();
  if(!fp){ mainEl.innerHTML = `<div class="empty-state">${t('user_not_found')}</div>`; return; }
  activeChatFriendId = friendId;
  if(notifications.some(n => n.senderId === friendId)){ notifications = notifications.filter(n => n.senderId !== friendId); renderNav(); updateTabTitleBadge(); }
  supabase.from('notifications').delete().eq('user_id', currentUser.id).eq('sender_id', friendId).then(() => {});

  mainEl.innerHTML = `<div class="feed-header"><h2>💬 ${escapeHtml(fp.nickname)}</h2></div>
    <div class="new-post-box chat-window"><div id="chatMessages" class="chat-messages"></div>
    <form id="chatForm" class="chat-form"><input type="text" id="chatInput" class="search-input" maxlength="1000" placeholder="${t('chat_input_placeholder')}" required><button type="submit" class="btn">${t('btn_send')}</button></form></div>`;
  const msgsEl = document.getElementById('chatMessages');

  function renderMessages(msgs){
    if(!msgs.length){ msgsEl.innerHTML = `<div class="empty-state">${t('no_messages_yet')}</div>`; return; }
    msgsEl.innerHTML = msgs.map(m => {
      const mine = m.sender_id === currentUser.id;
      return `<div class="chat-bubble ${mine ? 'mine' : 'theirs'}" data-message-id="${m.id}"><div class="txt">${escapeHtml(m.content)}</div>
        <div class="time">${timeAgo(m.created_at)}${m.edited_at ? ' · ' + t('edited_tag') : ''}${mine ? ` <span class="edit-msg-btn" data-action="edit-msg">${t('edit_btn')}</span>` : ''}${canDeleteMessage(m) ? ` <span class="edit-msg-btn" data-action="delete-msg">${t('delete_btn')}</span>` : ''}</div></div>`;
    }).join('');
    msgsEl.scrollTop = msgsEl.scrollHeight;
    msgsEl.querySelectorAll('[data-action="edit-msg"]').forEach(b => b.onclick = () => startEditMessage(b.closest('.chat-bubble')));
    msgsEl.querySelectorAll('[data-action="delete-msg"]').forEach(b => b.onclick = async () => {
      if(!confirm(t('confirm_delete_message'))) return;
      await supabase.from('direct_messages').delete().eq('id', b.closest('.chat-bubble').dataset.messageId); await loadMessages();
    });
  }
  function startEditMessage(bubble){
    const id = bubble.dataset.messageId, cur = bubble.querySelector('.txt').textContent;
    bubble.innerHTML = `<form class="edit-msg-form"><input type="text" class="search-input" value="${escapeHtml(cur)}" maxlength="1000" required><div style="display:flex;gap:6px;margin-top:8px"><button type="submit" class="btn small">${t('save_btn')}</button><button type="button" class="btn ghost small" data-cancel>${t('cancel_btn')}</button></div></form>`;
    const form = bubble.querySelector('form'), input = form.querySelector('input'); input.focus();
    form.onsubmit = async e => {
      e.preventDefault(); const nc = input.value.trim(); if(!nc) return;
      const { error } = await supabase.from('direct_messages').update({ content: nc, edited_at: new Date().toISOString() }).eq('id', id);
      if(error) alert(t('err_message_edit_failed') + error.message);
      await loadMessages();
    };
    form.querySelector('[data-cancel]').onclick = () => loadMessages();
  }
  async function loadMessages(){
    const { data } = await supabase.from('direct_messages').select('id, sender_id, receiver_id, content, created_at, edited_at')
      .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${friendId}),and(sender_id.eq.${friendId},receiver_id.eq.${currentUser.id})`)
      .order('created_at', { ascending: true }).limit(300);
    renderMessages(data || []);
  }
  await loadMessages();
  const ci = document.getElementById('chatInput'); ci.value = drafts['dm:' + friendId] || ''; ci.addEventListener('input', () => setDraft('dm:' + friendId, ci.value));
  document.getElementById('chatForm').onsubmit = async e => {
    e.preventDefault();
    const content = ci.value.trim(); if(!content) return;
    ci.value = ''; setDraft('dm:' + friendId, null);
    const { error } = await supabase.from('direct_messages').insert({ sender_id: currentUser.id, receiver_id: friendId, content });
    if(error){ alert(t('err_message_send_failed') + error.message); return; }
    await loadMessages();
  };
  if(dmChannel){ supabase.removeChannel(dmChannel); dmChannel = null; }
  dmChannel = supabase.channel('dm-' + [currentUser.id, friendId].sort().join('-'))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'direct_messages' }, payload => {
      const m = payload.new || {};
      if((m.sender_id === currentUser.id && m.receiver_id === friendId) || (m.sender_id === friendId && m.receiver_id === currentUser.id) || payload.eventType === 'DELETE') loadMessages();
    }).subscribe();
}

/* ================= ADMİN PANELİ ================= */
async function renderAdmin(){
  startAdminRealtime();
  const statusLabel = s => t('status_' + s);
  let html = `<div class="feed-header"><h2>${t('admin_heading')}</h2></div>`;
  if(isFounder()){
    const [{ data: apps }, { data: messages }] = await Promise.all([
      supabase.from('admin_applications').select('*, profiles!admin_applications_user_id_fkey(nickname)').order('created_at', { ascending: false }).limit(100),
      supabase.from('founder_messages').select('*, profiles!founder_messages_sender_id_fkey(nickname, role)').order('created_at', { ascending: false }).limit(200)
    ]);
    html += `<div class="admin-section"><h3>${t('mod_applications_heading')}</h3>
      ${(apps || []).length ? apps.map(a => `<div class="app-row" data-app-id="${a.id}"><div class="txt"><div class="who">${escapeHtml(a.profiles?.nickname || '?')} <span class="status-tag ${a.status}">${statusLabel(a.status)}</span></div><div class="msg">${escapeHtml(a.message)}</div></div>
        ${a.status === 'beklemede' ? `<div style="display:flex;gap:6px"><button class="btn small" data-app-action="kabul">${t('btn_accept')}</button><button class="btn ghost small" data-app-action="red">${t('btn_reject')}</button></div>` : ''}</div>`).join('') : `<div style="color:var(--dim);font-size:13px">${t('no_applications')}</div>`}</div>
      <div class="admin-section"><h3>${t('system_logs_heading')}</h3><div style="color:var(--warn);font-size:12px;margin-bottom:10px">${t('admin_note')}</div>
      ${(messages || []).length ? messages.map(m => {
        const fromAdmin = m.profiles?.role === 'admin';
        return `<div class="msg-row ${fromAdmin ? 'yellow' : ''}"><div class="from">${escapeHtml(m.profiles?.nickname || '?')} ${fromAdmin ? `<span class="status-tag yellow">${t('admin_tag')}</span>` : ''} · ${timeAgo(m.created_at)}</div><div class="body">${escapeHtml(m.content)}</div></div>`;
      }).join('') : `<div style="color:var(--dim);font-size:13px">${t('inbox_clean')}</div>`}</div>`;
  } else {
    const { data: myApp } = await supabase.from('admin_applications').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false }).limit(1).maybeSingle();
    html += `<div class="admin-section"><h3>${t('application_form_heading')}</h3>
      ${isAdminOrFounder() ? `<div style="color:var(--sick);font-size:13px">${t('role_sufficient')}</div>`
        : myApp ? `<div>${t('request_status')} <span class="status-tag ${myApp.status}">${statusLabel(myApp.status)}</span><div class="msg" style="margin-top:6px">${escapeHtml(myApp.message)}</div></div>`
        : `<form id="appForm"><div class="field"><label>${t('label_application_reason')}</label><textarea id="app-msg" required maxlength="500" placeholder="${t('application_placeholder')}"></textarea></div><button type="submit" class="btn">${t('btn_submit_form')}</button></form>`}</div>
      <div class="admin-section"><h3>${t('contact_management_heading')}</h3><form id="msgForm"><div class="field"><label>${t('label_message_detail')}</label><textarea id="msg-content" required maxlength="1000" placeholder="${t('message_placeholder')}"></textarea></div><button type="submit" class="btn">${t('btn_send_message')}</button></form></div>`;
  }
  if(currentRoute() !== 'admin') return;
  mainEl.innerHTML = html;

  if(isFounder()){
    document.querySelectorAll('[data-app-action]').forEach(btn => btn.onclick = async () => {
      const appId = btn.closest('.app-row').dataset.appId, status = btn.dataset.appAction;
      await supabase.from('admin_applications').update({ status }).eq('id', appId);
      if(status === 'kabul'){
        const { data: app } = await supabase.from('admin_applications').select('user_id').eq('id', appId).single();
        if(app) await supabase.from('profiles').update({ role: 'admin' }).eq('id', app.user_id);
      }
      renderAdmin();
    });
  } else {
    const af = document.getElementById('appForm');
    if(af) af.onsubmit = async e => { e.preventDefault(); const m = document.getElementById('app-msg').value.trim(); if(!m) return; await supabase.from('admin_applications').insert({ user_id: currentUser.id, message: m }); renderAdmin(); };
    const mf = document.getElementById('msgForm');
    if(mf) mf.onsubmit = async e => {
      e.preventDefault(); const c = document.getElementById('msg-content').value.trim(); if(!c) return;
      await supabase.from('founder_messages').insert({ sender_id: currentUser.id, content: c });
      alert(t('msg_sent_to_management')); document.getElementById('msg-content').value = '';
    };
  }
}

/* ================= YÖNLENDİRİCİ ================= */
function render(){
  if(!currentLang){ renderLanguageGate(); return; }
  document.documentElement.lang = currentLang;
  document.getElementById('siteFooter').textContent = t('footer_text');
  updateTabTitleBadge();
  if(currentUser && capacityFull){ renderCapacityFullScreen(); return; }
  renderNav();
  if(!currentUser){ renderAuthScreen(); return; }
  if(!currentProfile){ renderCompleteProfile(); return; }
  const route = currentRoute();
  releaseMedia(mainEl);
  if(!CATEGORY_KEYS.includes(route)){ allFetchedPosts = []; feedHasMore = true; feedLoadingMore = false; currentSearchQuery = ''; stopFeedRealtime(); }
  if(dmChannel && route !== 'dm/' + activeChatFriendId){ supabase.removeChannel(dmChannel); dmChannel = null; activeChatFriendId = null; }
  if(route !== 'admin') stopAdminRealtime();

  if(route === 'ana-sayfa') renderHome();
  else if(route === 'admin') renderAdmin();
  else if(route === 'destek') renderDestek();
  else if(route === 'arkadaslar') renderFriends();
  else if(route === 'bildirimler') renderNotifications();
  else if(route === 'yayinlar') renderGames();
  else if(route.startsWith('dm/')) renderChat(route.slice(3));
  else if(CATEGORY_KEYS.includes(route)) renderFeed(route);
  else window.location.hash = '#/ana-sayfa';
}

function renderCompleteProfile(){
  mainEl.innerHTML = `<div class="auth-wrap"><img src="${LOGO}" alt="" class="auth-logo"><h1>STRUD WEB</h1>
    <form id="cpForm"><div class="field"><label>${t('label_nickname')}</label><input type="text" id="cp-nickname" required maxlength="24"></div>
    <button type="submit" class="btn" style="width:100%">${t('setup_complete_btn')}</button><div id="cp-error" class="error-msg"></div></form>${langToggleHtml('cpLang')}</div>`;
  attachLangToggle('cpLang');
  document.getElementById('cpForm').onsubmit = async e => {
    e.preventDefault();
    const nickname = document.getElementById('cp-nickname').value.trim(); if(nickname.length < 3) return;
    const { error } = await supabase.from('profiles').insert({ id: currentUser.id, nickname });
    if(error){ document.getElementById('cp-error').textContent = t('err_nickname_taken'); return; }
    await refreshSession(); window.location.hash = '#/ana-sayfa';
  };
}

window.addEventListener('hashchange', render);

// Sekme 2 dk gizli kalırsa canlı bağlantı kapanır; dönünce yenilenir
let hiddenTimer = null, feedSuspended = false;
document.addEventListener('visibilitychange', () => {
  if(document.hidden){
    clearTimeout(hiddenTimer);
    hiddenTimer = setTimeout(() => { if(feedChannel){ stopFeedRealtime(); feedSuspended = true; } }, 120000);
  } else {
    clearTimeout(hiddenTimer);
    if(feedSuspended){
      feedSuspended = false;
      const route = currentRoute();
      if(currentUser && CATEGORY_KEYS.includes(route)){ startFeedRealtime(route); if(!mainEl.querySelector('.edit-post-form')) loadFeedData(route); }
    }
  }
});

refreshSession();
